  <!-- Building blocks -->
  <!-- Above Dlouhá, west of Revoluční -->
  <rect x="0" y="0" width="548" height="100" fill="#d4cec4"/>
  <!-- Above Dlouhá, east of Revoluční -->
  <rect x="568" y="0" width="232" height="100" fill="#d4cec4"/>
  <!-- Between Dlouhá and Rybná, west of Štupartská -->
  <rect x="0" y="115" width="298" height="140" fill="#d4cec4"/>
  <!-- Between Dlouhá and Salvátorská, Štupartská–Jakubská -->
  <rect x="307" y="115" width="83" height="88" fill="#d4cec4"/>
  <!-- Between Salvátorská and Rybná, Štupartská–Jakubská -->
  <rect x="307" y="214" width="83" height="41" fill="#d4cec4"/>
  <!-- Between Dlouhá and Salvátorská, Jakubská–Revoluční -->
  <rect x="400" y="115" width="148" height="88" fill="#d4cec4"/>
  <!-- Between Salvátorská and Rybná, Jakubská–Revoluční -->
  <rect x="400" y="214" width="148" height="41" fill="#d4cec4"/>
  <!-- Between Rybná and Celetná, west of Revoluční -->
  <rect x="0" y="267" width="548" height="75" fill="#d4cec4"/>
  <!-- Below Celetná, west of Revoluční -->
  <rect x="0" y="354" width="548" height="66" fill="#d4cec4"/>
  <!-- East of Revoluční, below Náměstí -->
  <rect x="568" y="267" width="232" height="75" fill="#d4cec4"/>
  <!-- East of Revoluční, below Celetná -->
  <rect x="568" y="354" width="232" height="66" fill="#d4cec4"/>

  <!-- Small courtyard/garden within western block -->
  <rect x="218" y="28" width="42" height="32" fill="#d0d9c8"/>

  <!-- Inner building detail rects (density texture) -->
  <!-- Above Dlouhá blocks -->
  <rect x="12" y="12" width="75" height="48" fill="#ccc5bb" rx="1"/>
  <rect x="100" y="10" width="58" height="44" fill="#ccc5bb" rx="1"/>
  <rect x="268" y="15" width="28" height="50" fill="#ccc5bb" rx="1"/>
  <rect x="310" y="12" width="90" height="56" fill="#ccc5bb" rx="1"/>
  <rect x="420" y="10" width="72" height="50" fill="#ccc5bb" rx="1"/>
  <rect x="580" y="12" width="82" height="46" fill="#ccc5bb" rx="1"/>
  <rect x="682" y="15" width="76" height="52" fill="#ccc5bb" rx="1"/>
  <!-- Between Dlouhá–Rybná, west of Štupartská -->
  <rect x="12" y="126" width="88" height="52" fill="#ccc5bb" rx="1"/>
  <rect x="115" y="122" width="58" height="62" fill="#ccc5bb" rx="1"/>
  <rect x="195" y="126" width="87" height="46" fill="#ccc5bb" rx="1"/>
  <rect x="12" y="198" width="78" height="50" fill="#ccc5bb" rx="1"/>
  <rect x="112" y="202" width="62" height="46" fill="#ccc5bb" rx="1"/>
  <rect x="192" y="196" width="90" height="52" fill="#ccc5bb" rx="1"/>
  <!-- Štupartská–Jakubská block -->
  <rect x="312" y="122" width="70" height="72" fill="#ccc5bb" rx="1"/>
  <!-- Jakubská–Revoluční block, Dlouhá–Salvátorská -->
  <rect x="403" y="122" width="98" height="66" fill="#ccc5bb" rx="1"/>
  <rect x="518" y="126" width="22" height="56" fill="#ccc5bb" rx="1"/>
  <!-- Rybná–Celetná blocks -->
  <rect x="12" y="280" width="98" height="52" fill="#ccc5bb" rx="1"/>
  <rect x="132" y="277" width="67" height="57" fill="#ccc5bb" rx="1"/>
  <rect x="222" y="280" width="77" height="50" fill="#ccc5bb" rx="1"/>
  <rect x="322" y="277" width="82" height="54" fill="#ccc5bb" rx="1"/>
  <rect x="410" y="280" width="87" height="52" fill="#ccc5bb" rx="1"/>
  <!-- Below Celetná blocks -->
  <rect x="15" y="362" width="112" height="46" fill="#ccc5bb" rx="1"/>
  <rect x="162" y="360" width="82" height="52" fill="#ccc5bb" rx="1"/>
  <rect x="282" y="362" width="102" height="50" fill="#ccc5bb" rx="1"/>
  <rect x="412" y="364" width="82" height="46" fill="#ccc5bb" rx="1"/>
  <!-- East blocks below Náměstí -->
  <rect x="580" y="282" width="97" height="50" fill="#ccc5bb" rx="1"/>
  <rect x="700" y="280" width="82" height="52" fill="#ccc5bb" rx="1"/>
  <rect x="582" y="364" width="97" height="46" fill="#ccc5bb" rx="1"/>
  <rect x="702" y="362" width="77" height="50" fill="#ccc5bb" rx="1"/>

  <!-- Major streets (white) -->
  <!-- Dlouhá E-W -->
  <rect x="0" y="100" width="800" height="15" fill="#ffffff"/>
  <!-- Revoluční N-S -->
  <rect x="548" y="0" width="20" height="420" fill="#ffffff"/>

  <!-- Minor streets (#f5f3ef) -->
  <!-- Rybná E-W -->
  <rect x="0" y="255" width="800" height="12" fill="#f5f3ef"/>
  <!-- Celetná E-W -->
  <rect x="0" y="342" width="800" height="12" fill="#f5f3ef"/>
  <!-- Štupartská / V Kolkovně N-S short -->
  <rect x="298" y="100" width="9" height="170" fill="#f5f3ef"/>
  <!-- Jakubská N-S -->
  <rect x="390" y="100" width="10" height="242" fill="#f5f3ef"/>
  <!-- Salvátorská E-W — pin point (400,210) lies within this rect -->
  <rect x="300" y="203" width="248" height="11" fill="#f5f3ef"/>

  <!-- Minor cross-streets for texture (6 px wide) -->
  <rect x="175" y="100" width="6" height="155" fill="#f5f3ef"/>
  <rect x="460" y="100" width="6" height="103" fill="#f5f3ef"/>
  <rect x="86" y="267" width="6" height="75" fill="#f5f3ef"/>
  <rect x="252" y="267" width="6" height="75" fill="#f5f3ef"/>

  <!-- Street label -->
  <text x="344" y="211" font-family="sans-serif" font-size="9" fill="#888888" letter-spacing="1" text-anchor="middle">Salvátorská</text>
